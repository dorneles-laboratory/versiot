name: versiot-stack

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: versiot_frontend_prod
    container_name: versiot_frontend_prod
    restart: always
    networks:
      - gateway_net
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  gateway_net:
    external: true

